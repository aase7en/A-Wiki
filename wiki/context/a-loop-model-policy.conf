# a-loop-model-policy.conf — A-Loop Phase → Model Tier Mapping
#
# Context (2026-07-25): Fable5 → pay-as-you-go, Opus 5 released (≈Fable5
# capability). This config tells A-Loop which tier to use per phase so
# Opus 5 (premium) is spent ONLY where deep reasoning pays off, and
# free/cheap tiers handle routine work.
#
# Aligns with AGENTS.md Cost-First Decision Pyramid:
#   Level -1: local (FTS5/graph)        — free
#   Level 1:  free-current roster        — free
#   Level 2:  cheap-capable              — very cheap
#   Level 4c: platform-primary (Opus 5)  — premium, reserved for deep work
#
# Override per-run: A_LOOP_TIER_PHASE1=4c (forces Opus5 for decompose)
# Read by: skills/awiki/a-loop/SKILL.md + references/phase-*.md

[phases]
# Phase 1 Decompose: ทำน้อยครั้ง, decisions สำคัญมาก (กำหนด task ทั้งหมด)
# → Opus 5 (tier 4c) — คุ้มเพราะผิดที่นี่ = เสียเวลาทั้ง loop
phase1_decompose_tier = 4c
phase1_decompose_model_hint = anthropic/claude-opus-5
phase1_decompose_reason = deep reasoning, one-shot, high-stakes decomposition

# Phase 2 Execute: routine code/test, มี tdd ตรวจ → model ไม่ต้องเก่งมาก
# → free/cheap (tier 1-2) — ประหยัด, มี verify กันคุณภาพ
phase2_execute_tier = 1
phase2_execute_model_hint = free-current
phase2_execute_reason = routine work, tdd gate catches errors, high volume

# Phase 3 Distill: pattern detection = deterministic (count + group)
# → free (tier -1 or 1) — ไม่ต้องการ reasoning
phase3_distill_tier = 1
phase3_distill_model_hint = free-current
phase3_distill_reason = deterministic counting, no deep reasoning needed

# Phase 4 Improve: ออกแบบ skill ใหม่ = deep reasoning, ทำน้อยครั้ง
# → Opus 5 (tier 4c) — คุ้มเพราะ skill quality = brain quality ระยะยาว
phase4_improve_tier = 4c
phase4_improve_model_hint = anthropic/claude-opus-5
phase4_improve_reason = novel skill design, one-shot, durable capability gain

[env_overrides]
# Force a tier per phase (emergencies / experiments)
# A_LOOP_TIER_PHASE1=1   # use free instead of Opus5 for decompose
# A_LOOP_TIER_PHASE4=1   # use free instead of Opus5 for skill design

[cost_guard]
# Hard cap: if Opus5 calls in a single A-Loop run exceed this → warn + suggest tier-down
max_opus5_calls_per_run = 4
warn_message = "⚠️ A-Loop used Opus5 N times this run. Consider: free tier for Phase 2/3, reserve Opus5 for Phase 1/4 only."
