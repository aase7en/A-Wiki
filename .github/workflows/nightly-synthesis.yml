name: Nightly Synthesis
on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 03:00 Thailand
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # the ledger lives in runner-local .tmp only on dev machines; on CI
      # we synthesize from an empty ledger (keeps the workflow exercised)
      # until ledger shards are exported to a reachable artifact store.
      - run: python scripts/nightly-synthesis.py
