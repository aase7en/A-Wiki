name: Provider Balance Check
# ☁️ Query API balances from all connected providers
# [Thai ไอ้A Plus Spot.] · A-Wiki Brain + Hermes Agent
#
# P1.5 (A-Wiki vNext): the unpinned third-party telegram action is gone —
# shell command substitution does NOT expand inside `with:` blocks, so the
# old message body was posted as a literal string instead of the report.
# Reports now ship as workflow artifact + direct Bot-API POST via Python stdlib.

on:
  workflow_dispatch:          # Manual trigger
  schedule:
    - cron: '0 6 * * *'      # Daily 6AM UTC = 1PM ICT

permissions:
  contents: read    # script checkout only — no commits, no pushes

jobs:
  check-balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Repo secrets are optional on forks / before setup — skip gracefully
      # (with a visible notice) instead of failing every day.
      - name: Check secrets configured
        id: cfg
        run: |
          if [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::API-key secrets not configured in repo settings — balance check skipped"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "telegram=false" >> "$GITHUB_OUTPUT"
          else
            echo "telegram=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Provider Balances
        if: steps.cfg.outputs.configured == 'true'
        run: python3 scripts/hermes/provider-balance-check.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

      - name: Upload balance report artifact
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: provider-balance-report
          path: |
            provider-balance-report.md
            provider-balance-report.json
          if-no-files-found: ignore

      # NOTE: the `secrets` context is not usable in step-level `if` —
      # gate via the cfg step outputs instead.
      - name: Post results to Telegram
        if: steps.cfg.outputs.configured == 'true' && steps.cfg.outputs.telegram == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request

          text = pathlib.Path("provider-balance-report.md").read_text(encoding="utf-8")
          header = "☁️ Provider Balance Report\n\n"
          # Telegram caps messages at 4096 chars — chunk with header on each part
          limit, chunk = 4000, 3600
          parts = [text[i:i + chunk] for i in range(0, min(len(text), limit), chunk)] or [""]
          for n, part in enumerate(parts, 1):
              suffix = f"\n\n({n}/{len(parts)})" if len(parts) > 1 else ""
              body = json.dumps({
                  "chat_id": os.environ["TG_CHAT"],
                  "text": header + part + suffix,
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
                  data=body, headers={"Content-Type": "application/json"},
              )
              urllib.request.urlopen(req, timeout=30).read()
          print(f"telegram: posted {len(parts)} message(s)")
          PY
