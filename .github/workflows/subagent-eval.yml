name: A-Wiki Subagent Eval

# P3 — weekly eval regression detection. Runs scripts/eval/run_subagent_eval.py
# across all domains, compares pass@k against the previous results file
# (evals/subagents/results/results-*.json), and opens a regression issue if any
# (suite, model) pair dropped > 0.10.
#
# R-P1-001 (vNext Phase 1 remediation): this workflow no longer mutates the
# checked-out default branch — ever. Two jobs:
#   eval    — runs on schedule AND dispatch; contents: read; results/reports
#             go to artifacts + issues only (race history included).
#   promote — dispatch-only; restores artifacts, applies adaptive-routing /
#             cost-optimizer changes, and lands EVERYTHING on a named
#             promotion/* branch via PR. No direct default-branch pushes remain.

on:
  workflow_dispatch:
    inputs:
      domains:
        description: "Comma-separated domain suites to run (empty = all)"
        required: false
        default: ""
      k:
        description: "Samples per case (lower = cheaper; CI default 2)"
        required: false
        default: "2"
      create_issue:
        description: "Create or update a regression issue when pass@k dropped"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # Mon 3:23 UTC (after agent-model-scan 2:41 + cross-platform 3:17)
    - cron: "23 3 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: subagent-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Run subagent eval + regression check (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read   # scheduled/report execution holds no write (R-P1-001.5)
      issues: write    # regression issue

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need previous results file for baseline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # eval runner + regression check have no third-party deps (stdlib only)
          pip install pytest  # for a quick smoke of the regression tests

      - name: Verify required secrets
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          missing=0
          for v in OPENROUTER_API_KEY DEEPSEEK_API_KEY GEMINI_API_KEY ZHIPU_API_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "⚠️ $v not set — eval will skip that provider (models fall back to OpenRouter)"
              missing=1
            else
              echo "✓ $v is set"
            fi
          done
          # OPENROUTER is the fallback for ALL candidate models — hard requirement.
          # Without it, AWIKI_FORCE_MODEL in delegate.sh cannot route any model.
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "❌ OPENROUTER_API_KEY is required (unlocks all candidate models via AWIKI_FORCE_MODEL)."
            echo "   Set it in: GitHub repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "::warning::Some provider secrets missing — eval may produce partial results (only OpenRouter-routed models will be tested)."
          fi

      - name: Smoke-test regression logic (offline)
        run: |
          python -m pytest tests/test_regression_check.py tests/test_run_subagent_eval.py -q

      - name: Snapshot baseline (latest results file before this run)
        id: baseline
        run: |
          set -euo pipefail
          mkdir -p .tmp/subagent-eval
          latest="$(ls -t evals/subagents/results/results-*.json 2>/dev/null | head -1 || true)"
          if [ -n "$latest" ]; then
            cp "$latest" .tmp/subagent-eval/baseline.json
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
            echo "Using baseline: $latest"
          else
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            echo "No prior results file — first run, no regression baseline."
          fi

      - name: Run eval (real API)
        id: eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          AWIKI_DISABLE_DASHBOARD_AUTOSTART: "1"
        run: |
          set -euo pipefail
          DOMAINS="${{ github.event.inputs.domains || '' }}"
          K="${{ github.event.inputs.k || '2' }}"
          if [ -n "$DOMAINS" ]; then
            # Run each requested domain individually.
            IFS=',' read -ra SUITES <<< "$DOMAINS"
            for s in "${SUITES[@]}"; do
              s="$(echo "$s" | xargs)"  # trim whitespace
              [ -z "$s" ] && continue
              echo "::group::Eval suite: $s"
              python3 scripts/eval/run_subagent_eval.py --domain "$s" --apply --k "$K" || \
                echo "::warning::Eval failed for $s (rate limit?) — continuing"
              echo "::endgroup::"
            done
          else
            echo "::group::Eval all suites"
            python3 scripts/eval/run_subagent_eval.py --all --apply --k "$K" || \
              echo "::warning::Eval --all failed (rate limit?) — partial results may exist"
            echo "::endgroup::"
          fi

      - name: Regression check (new vs baseline)
        id: regression
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, glob, os, sys
          sys.path.insert(0, "scripts/eval")
          import regression_check as rc

          new_files = sorted(glob.glob("evals/subagents/results/results-*.json"))
          if not new_files:
              print("::warning::No results file produced — eval may have failed entirely.")
              open(".tmp/subagent-eval/regression-report.md", "w").write(
                  "## Subagent Eval — No Results\n\nEval produced no results file. "
                  "Check the workflow log for API errors.\n")
              # Mark no-regression so we don't open an issue for a missing-results case.
              open(".tmp/subagent-eval/has-regression", "w").write("false")
              sys.exit(0)

          new_path = new_files[-1]
          new = json.loads(open(new_path, encoding="utf-8").read())
          baseline = {}
          if os.path.exists(".tmp/subagent-eval/baseline.json"):
              baseline = json.loads(open(".tmp/subagent-eval/baseline.json", encoding="utf-8").read())

          rows = rc.detect_regression(baseline, new, threshold=0.10)
          report = rc.render_regression_report(rows)
          open(".tmp/subagent-eval/regression-report.md", "w", encoding="utf-8").write(report)

          has_regression = any(r["severity"] in ("regression", "removed") for r in rows)
          open(".tmp/subagent-eval/has-regression", "w").write("true" if has_regression else "false")
          print(report)
          PYEOF

      # ── T4: Multi-model race ทุก suite (concurrent, ขยายจาก S5 medical pilot) ──
      # Fires 3 candidate models ที่ทุก single-agent suite concurrently (k=1, cheap).
      # ข้าม pipeline-*.json (DAG suites — race ใช้กับ single-agent เท่านั้น).
      # continue-on-error: race failure MUST NOT block eval pipeline.
      - name: Multi-model race (all suites, concurrent)
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p .tmp/subagent-eval/races
          for suite_file in evals/subagents/*.json; do
            suite_name=$(basename "$suite_file" .json)
            # ข้าม pipeline suites (มี 'stages' key = DAG, race ใช้กับ single-agent)
            if python3 -c "import json,sys; d=json.load(open('$suite_file')); sys.exit(0 if 'stages' in d else 1)" 2>/dev/null; then
              echo "⏭️  ข้าม $suite_name (pipeline suite)"
              continue
            fi
            echo "::group::Race: $suite_name"
            python3 scripts/eval/race_eval.py \
              --suite "$suite_name" --models deepseek-v4-flash,deepseek-v4-pro,glm-5.2 \
              --k 1 --max-workers 6 --json \
              > ".tmp/subagent-eval/races/$suite_name.json" 2>/dev/null || true
            echo "::endgroup::"
          done
          echo "=== Race summary (all suites) ==="
          python3 -c "
          import json, glob
          for f in sorted(glob.glob('.tmp/subagent-eval/races/*.json')):
              try:
                  d = json.load(open(f))
                  suite = f.replace('\\\\','/').split('/')[-1].replace('.json','')
                  overall = d.get('overall', {})
                  if overall:
                      best = max(overall, key=lambda m: overall[m].get('mean_pass_at_k',0))
                      rate = overall[best].get('mean_pass_at_k',0)
                      print(f'  {suite:<22} best={best:<20} pass@k={rate:.2f}')
              except Exception:
                  continue
          " 2>/dev/null || echo "(race summary failed)"

      # ── V2 (R-P1-001): race history เป็น artifact แทน tracked dir + commit ──
      # snapshot race results ลง .tmp (artifact) — trend อ่านจาก artifact history
      - name: Snapshot race results (history artifact — no git)
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p .tmp/subagent-eval/races-history
          if [ -d .tmp/subagent-eval/races ]; then
            DATE_TAG=$(date -u +%Y%m%d-%H%M%S)
            for f in .tmp/subagent-eval/races/*.json; do
              [ -f "$f" ] || continue
              suite=$(basename "$f" .json)
              cp "$f" ".tmp/subagent-eval/races-history/${suite}-${DATE_TAG}.json"
            done
            echo "✓ Race snapshot staged for artifact upload (no repo writes — R-P1-001)."
          fi

      # ── W4: DAG pipeline eval (council pattern + finance/medical) ──
      - name: DAG pipeline eval (council + finance + medical)
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          AWIKI_DISABLE_DASHBOARD_AUTOSTART: "1"
        run: |
          set -uo pipefail
          mkdir -p .tmp/subagent-eval
          echo "::group::Pipeline eval (all)"
          python3 scripts/eval/run_pipeline_eval.py --all --apply --k 1 \
            > .tmp/subagent-eval/pipeline-results.json 2>&1 || true
          echo "::endgroup::"
          echo "=== Pipeline eval done ==="
          cat .tmp/subagent-eval/pipeline-results.json 2>/dev/null | python3 -m json.tool 2>/dev/null | head -30 || echo "(pipeline eval skipped)"

      # ── Q6: Adaptive routing preview (always; apply moved to promote job) ──
      - name: Adaptive routing preview (always)
        run: |
          set -euo pipefail
          mkdir -p .tmp/subagent-eval
          # Snapshot observatory stats from dashboard (if reachable; else skip).
          curl -sf "http://localhost:7790/api/subagents/stats?since=604800" \
            > .tmp/subagent-eval/latest-stats.json 2>/dev/null || \
            echo '{"by_subagent":{}}' > .tmp/subagent-eval/latest-stats.json
          python3 scripts/eval/apply_adaptive_routing.py \
            --stats-json .tmp/subagent-eval/latest-stats.json \
            --eval-results evals/subagents/results/ \
            --min-samples 30 --min-delta 0.20 \
            > .tmp/subagent-eval/adaptive-preview.txt 2>&1 || true
          echo "=== Adaptive routing preview ==="
          cat .tmp/subagent-eval/adaptive-preview.txt || true

      # ── U1: Cost optimization preview (always; apply moved to promote job) ──
      - name: Cost optimization preview (always)
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 scripts/eval/apply_cost_optimizer.py --analyze --min-savings 1.00 \
            > .tmp/subagent-eval/cost-optimize-preview.txt 2>&1 || true
          echo "=== Cost optimization preview ==="
          cat .tmp/subagent-eval/cost-optimize-preview.txt || echo "(no recommendations)"

      - name: Upload report + results
        uses: actions/upload-artifact@v4
        with:
          name: subagent-eval-report
          path: |
            .tmp/subagent-eval/
            evals/subagents/results/
          if-no-files-found: ignore

      - name: Create or update regression issue
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_issue != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          HAS_REG="$(cat .tmp/subagent-eval/has-regression 2>/dev/null || echo false)"
          if [ "$HAS_REG" != "true" ]; then
            echo "No regression detected — skipping issue creation."
            exit 0
          fi
          title="🚨 Subagent eval regression detected"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body_file=".tmp/subagent-eval/regression-report.md"
          {
            # Prepend the workflow link to the report.
            tmp="$(mktemp)"
            echo "A scheduled subagent eval run detected pass\@k regressions." > "$tmp"
            echo "" >> "$tmp"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$tmp"
            echo "" >> "$tmp"
            cat "$body_file" >> "$tmp"
            mv "$tmp" "$body_file"
          }
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$body_file"
            echo "Updated existing issue #$existing."
          else
            gh issue create --title "$title" --body-file "$body_file"
            echo "Created new regression issue."
          fi

  # ── R-P1-001: promotion job — dispatch-only, PR-gated, never pushes main ──
  promote:
    name: Promote results + recommendations (manual only, PR-gated)
    needs: eval
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push promotion branch only
      pull-requests: write   # open the promotion PR (the gate)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore eval artifacts
        uses: actions/download-artifact@v4
        with:
          name: subagent-eval-report
          path: restored

      - name: Place artifacts back into workspace paths
        run: |
          set -euo pipefail
          mkdir -p evals/subagents
          cp -r restored/.tmp . 2>/dev/null || true
          cp -r restored/evals/subagents/results evals/subagents/ 2>/dev/null || true
          ls -la .tmp/subagent-eval/ || true

      - name: Apply adaptive-routing recommendations
        run: |
          set -euo pipefail
          RECS=$(python3 -c "
          import json, sys
          sys.path.insert(0, 'scripts/eval')
          import apply_adaptive_routing as aa
          import adaptive_routing as ar
          stats = json.load(open('.tmp/subagent-eval/latest-stats.json'))
          from pathlib import Path
          eval_results = aa._load_results(Path('evals/subagents/results/'))
          if not eval_results:
              print(0); sys.exit()
          current = aa._load_current_models()
          mapping = aa.build_suite_to_subagents(aa.SUITES_DIR)
          changes = ar.recommend_model_changes(stats, eval_results, current, mapping,
                                               config={'min_samples': 30, 'min_delta': 0.20})
          print(sum(1 for c in changes if c.get('status') == 'recommend'))
          " 2>/dev/null || echo 0)
          echo "Adaptive-routing recommendations to apply: $RECS"
          if [ "$RECS" -gt 0 ]; then
            python3 scripts/eval/apply_adaptive_routing.py --apply \
              --stats-json .tmp/subagent-eval/latest-stats.json \
              --eval-results evals/subagents/results/ \
              --min-samples 30 --min-delta 0.20
          else
            echo "No recommendations met the tight guardrails (30 samples / 0.20 delta)."
          fi

      - name: Apply cost-optimization recommendations
        continue-on-error: true
        run: |
          set -uo pipefail
          RECS=$(python3 -c "
          import glob, json, sys
          sys.path.insert(0, 'scripts/eval')
          import cost_optimizer as co, cost_aware_recommend as cr
          files = sorted(glob.glob('evals/subagents/results/results-*.json'))
          if not files: print(0); sys.exit()
          results = json.loads(open(files[-1], encoding='utf-8').read())
          cm = cr._load_default_cost_matrix()
          n = 0
          for suite, sd in results.items():
              if not isinstance(sd, dict): continue
              bm = sd.get('by_model', {})
              if not bm: continue
              cbm = {m: cr.cost_per_1k_calls(m, cm) or 0.0 for m in bm}
              cur = list(bm.keys())[0] if bm else ''
              r = co.analyze_suite(suite, bm, cbm, cur, min_pass_at_k=0.7, min_savings=1.00)
              if r and r.get('status') == 'recommend': n += 1
          print(n)
          " 2>/dev/null || echo 0)
          echo "Cost optimization recommendations (>= \$1.00 savings): $RECS"
          if [ "$RECS" -gt 0 ]; then
            python3 scripts/eval/apply_cost_optimizer.py --apply --min-savings 1.00 || true
          else
            echo "No cost optimizations met guardrails (pass@k ≥ 0.7, savings ≥ \$1.00)."
          fi

      - name: Commit everything to promotion branch + open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "a-wiki-subagent-eval"
          git config user.email "subagent-eval@a-wiki"
          # N-P1-001 policy (Phase 8): races = artifact telemetry only — never
          # copied into the tracked tree by promotion.
          git add evals/subagents/results/ agents/subagents/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to promote (no results or policy changes)."
            exit 0
          fi
          BRANCH="promotion/subagent-eval-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "test(eval): subagent eval promotion candidate $(date -u +%Y-%m-%d) [PR-gated: results + recommended model swaps · races = artifact telemetry only]"
          git push origin "$BRANCH"
          gh pr create \
            --title "Subagent eval promotion candidate $(date -u +%Y-%m-%d)" \
            --body "Auto-generated **promotion candidate** from a manual subagent-eval dispatch (R-P1-001 gate): results snapshots and guardrailed adaptive-routing / cost-optimization model swaps (races = artifact telemetry only, not promoted). Scheduled runs are report-only. Review diff + artifact, run \`python -m pytest tests/test_regression_check.py tests/test_run_subagent_eval.py -q\`, then merge explicitly. Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
