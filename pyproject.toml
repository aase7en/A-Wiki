[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awiki"
version = "1.0.0"
description = "One-command access to your A-Wiki second brain (awiki search/status/plan) — thin launcher; clone the repo for the full brain"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aase7en" }]
keywords = ["ai", "second-brain", "knowledge-base", "agents", "wiki"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aase7en/A-Wiki"
Documentation = "https://github.com/aase7en/A-Wiki/blob/main/docs/getting-started.md"

[project.scripts]
awiki = "awiki_cli.cli:main"

[tool.setuptools]
packages = ["awiki_cli"]
